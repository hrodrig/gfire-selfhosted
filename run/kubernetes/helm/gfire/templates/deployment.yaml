apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gfire.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "gfire.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gfire.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gfire.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gfire
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["server"]
          ports:
            - containerPort: {{ .Values.service.targetPort | default 8080 }}
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: GFIRE_SERVER_HOST
              value: {{ .Values.env.host | quote }}
            - name: GFIRE_SERVER_PORT
              value: {{ .Values.env.port | quote }}
            - name: GFIRE_SERVER_SERVER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GFIRE_STORAGE_BACKEND
              value: {{ .Values.env.storageBackend | quote }}
            - name: GFIRE_SERVER_WORKERS
              value: {{ .Values.env.workers | quote }}
            {{- if ne (.Values.env.logLevel | default "") "" }}
            - name: GFIRE_LOGGING_LEVEL
              value: {{ .Values.env.logLevel | quote }}
            {{- end }}
            {{- if eq .Values.env.storageBackend "postgres" }}
            - name: GFIRE_STORAGE_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "gfire.postgresSecretName" . }}
                  key: {{ .Values.postgres.secretKey }}
            {{- end }}
            - name: GFIRE_AUTH_ENABLED
              value: {{ .Values.env.authEnabled | quote }}
            {{- if eq .Values.env.authEnabled "true" }}
            - name: GFIRE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "gfire.authSecretName" . }}
                  key: {{ .Values.auth.secretKey }}
            {{- end }}
            - name: TMPDIR
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
