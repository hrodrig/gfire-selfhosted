# json-file log rotation (avoids unbounded container log growth on disk).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # PG 18+: official image VOLUME is /var/lib/postgresql (not .../data).
    # Do not reuse a PG16 data directory here — dump/restore or fresh init.
    # Bookworm (not Alpine): fewer High CVEs in typical grype/docker scans.
    image: postgres:18.4-bookworm
    container_name: gfire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gfire}
      POSTGRES_USER: ${POSTGRES_USER:-gfire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ${GFIRE_HOST_DATA}/.env}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # Durable DB files live under GFIRE_HOST_DATA (outside the git clone on servers).
      - ${GFIRE_HOST_DATA:?set GFIRE_HOST_DATA in .env}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gfire} -d ${POSTGRES_DB:-gfire}"]
      interval: 3s
      timeout: 3s
      retries: 10
    logging: *default-logging

  gfire:
    # Full ref overrides GFIRE_VERSION+GHCR: set GFIRE_IMAGE in ${GFIRE_HOST_DATA}/.env.
    image: ${GFIRE_IMAGE:-ghcr.io/hrodrig/gfire:${GFIRE_VERSION:-v1.0.0}}
    container_name: gfire
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Distroless image default CMD is "version"; start the API + workers.
    command: ["server"]
    ports:
      - "${GFIRE_HOST_PORT:-8080}:8080"
    environment:
      GFIRE_SERVER_HOST: "0.0.0.0"
      GFIRE_SERVER_PORT: "8080"
      GFIRE_STORAGE_BACKEND: ${GFIRE_STORAGE_BACKEND:-postgres}
      GFIRE_STORAGE_POSTGRES_DSN: ${GFIRE_STORAGE_POSTGRES_DSN:?set GFIRE_STORAGE_POSTGRES_DSN in ${GFIRE_HOST_DATA}/.env}
      GFIRE_AUTH_ENABLED: ${GFIRE_AUTH_ENABLED:-false}
      GFIRE_AUTH_TOKEN: ${GFIRE_AUTH_TOKEN:-}
      # Optional redis backend when using --profile redis (set in HOST_DATA .env):
      # GFIRE_STORAGE_REDIS_ADDR: ${GFIRE_STORAGE_REDIS_ADDR:-redis:6379}
    # Optional: mount an app config from HOST_DATA (create the file first):
    # volumes:
    #   - ${GFIRE_HOST_DATA}/gfire.yaml:/app/gfire.yaml:ro
    # command: ["server", "--config", "/app/gfire.yaml"]
    logging: *default-logging

  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    container_name: gfire-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - ${GFIRE_HOST_DATA:?set GFIRE_HOST_DATA in .env}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    logging: *default-logging

  valkey:
    profiles: ["valkey"]
    image: valkey/valkey:8-alpine
    container_name: gfire-valkey
    restart: unless-stopped
    ports:
      - "${VALKEY_HOST_PORT:-6380}:6379"
    volumes:
      - ${GFIRE_HOST_DATA:?set GFIRE_HOST_DATA in .env}/valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    logging: *default-logging
