# Publishes Helm charts to GitHub Pages (index.yaml + .tgz on gh-pages) on tag v*.
name: Release Charts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Ensure gh-pages branch exists
        run: |
          set -euo pipefail
          TAG_SHA=$(git rev-parse HEAD)
          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            echo "Remote branch gh-pages already exists."
          else
            echo "Creating orphan gh-pages (first Helm chart publish)..."
            git checkout --orphan gh-pages-init
            git rm -rf . 2>/dev/null || true
            # Landing matches gghstats/pgwd-selfhosted (index.html + README); chart-releaser adds index.yaml.
            cat > README.md <<'EOF'
# Helm chart index (gfire)

This **`gh-pages`** branch is the **Helm chart repository** served at
**https://hrodrig.github.io/gfire-selfhosted/**.

See **index.html** for the browser landing. Operator docs: https://github.com/hrodrig/gfire-selfhosted
EOF
            cat > index.html <<'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Helm chart repo · gfire (self-hosted)</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.55; color: #1a1a1a; }
    h1 { font-size: 1.35rem; margin-top: 0; }
    h2 { font-size: 1.1rem; margin-top: 1.5rem; }
    a { color: #0969da; }
    code { background: #f6f8fa; padding: 0.12em 0.35em; border-radius: 4px; font-size: 0.92em; }
    pre { background: #f6f8fa; padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 0.88rem; }
    .muted { color: #656d76; font-size: 0.95rem; }
  </style>
</head>
<body>
  <h1>Helm repository · gfire</h1>
  <p>This site hosts the Helm chart <strong>index</strong> for deploying
    <a href="https://github.com/hrodrig/gfire">gfire</a> on Kubernetes.
    Published from <a href="https://github.com/hrodrig/gfire-selfhosted">gfire-selfhosted</a>.</p>
  <p>Helm clients fetch <a href="index.yaml"><code>index.yaml</code></a> — a browser is optional.</p>
  <h2>Add the repo and install</h2>
  <pre><code>helm repo add gfire https://hrodrig.github.io/gfire-selfhosted
helm repo update
helm install gfire gfire/gfire -n gfire --create-namespace -f my-values.yaml</code></pre>
  <p class="muted"><strong>Full docs:</strong>
    <a href="https://github.com/hrodrig/gfire-selfhosted/blob/main/README.md">gfire-selfhosted README</a>
    · <strong>Application:</strong> <a href="https://github.com/hrodrig/gfire">hrodrig/gfire</a></p>
</body>
</html>
EOF
            touch .nojekyll
            git add README.md index.html .nojekyll
            git commit -m "chore: initialize gh-pages Helm landing (gghstats pattern)"
            git push origin HEAD:gh-pages
            git checkout "$TAG_SHA"
          fi
          git fetch origin

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: run/kubernetes/helm
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
